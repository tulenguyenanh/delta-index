# Daily OptiBot delta sync: build the run-once image and run it on GitHub's
# hosted runner. Free for a public repo, no card. The key comes from the repo
# secret GOOGLE_API_KEY and is passed to the container by name only, so it
# never appears on a command line, in a layer, or in git.
name: daily-sync

on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC (off the top of the hour, when GitHub queues are busiest)
  workflow_dispatch: # "Run workflow" button for a manual run

permissions:
  contents: read

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GEMINI_STORE_NAME: fileSearchStores/optibotknowledgebase-cw6vlpxd70kt
    steps:
      - name: Check the API key secret is set
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::Repo secret GOOGLE_API_KEY is missing or empty (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t optibot-sync .

      - name: Run delta sync
        run: docker run --name sync -e API_KEY -e GEMINI_STORE_NAME optibot-sync

      - name: Collect last-run.json
        run: |
          docker cp sync:/app/last-run.json last-run.json
          {
            echo '### Last run'
            echo '```json'
            cat last-run.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: last-run
          path: last-run.json
