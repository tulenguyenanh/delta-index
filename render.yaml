# Render Blueprint for the OptiBot daily delta-sync cron job.
#
# Documentation-first: the Render dashboard ("New -> Cron Job") is the primary,
# always-works deploy path. This Blueprint is the reproducible-by-commit
# alternative ("New -> Blueprint" pointed at the repo). The YAML shape below is
# synthesised from the documented Blueprint field names (RESEARCH.md Assumption
# A1) — verify against the dashboard on first deploy.
#
# The repo has no "optisigns"-derived name; nothing here depends on the host.
services:
  - type: cron
    name: optibot-daily-sync
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 6 * * *" # daily 06:00 UTC
    region: oregon
    # plan omitted -> Render defaults to 0.5c-512mb ($1/month minimum)
    envVars:
      - key: GOOGLE_API_KEY
        sync: false # set the value only in the Render dashboard; never in git
      - key: GEMINI_STORE_NAME
        value: fileSearchStores/optibotknowledgebase-cw6vlpxd70kt
